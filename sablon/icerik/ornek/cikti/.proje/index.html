<!doctype html>
<html lang="tr" data-resolution="portrait">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="marka/gsap.min.js"></script>
<link rel="stylesheet" href="marka/stil.css" />
<style>#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground)} .clip{position:absolute;inset:0}</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
<div id="bg" class="clip" data-start="0" data-duration="4" data-track-index="0"><div class="grid"></div>
    <div class="blob" id="b1" style="left:-120px;top:300px;width:420px;height:760px"></div>
    <div class="blob" id="b2" style="left:640px;top:120px;width:380px;height:680px"></div>
    <div class="blob" id="b3" style="left:300px;top:1100px;width:460px;height:820px"></div>
    <div class="blob" id="b4" style="left:700px;top:1250px;width:360px;height:640px"></div></div>
<div id="s0" class="clip" data-start="0" data-duration="4" data-track-index="2"><div class="hl" id="s0h" style="top:250px;font-size:76px;line-height:1.08"><span class="ln">Suda ağırlığınızı</span><span class="ln"><em>su</em> taşır.</span></div>
  <div class="dash" id="s0d1" style="left:72px;top:436px;width:70px;background:var(--red)"></div>
  <div class="dash" id="s0d2" style="left:154px;top:436px;width:70px;background:var(--blue)"></div><div class="kicker" id="s0k" style="top:484px">AYAKTA DURURKEN TAŞINAN VÜCUT AĞIRLIĞI</div><div class="card" id="s0c" style="left:72px;top:574px;width:936px;height:370px"><div class="row-label" id="s0l0" style="left:36px;top:24px;font-size:30px">Karada</div>
      <div class="bar" id="s0b0" style="left:300px;top:20px;width:520px;height:46px;background:var(--navy)"></div>
      <div class="val" id="s0y0" style="left:836px;top:24px;font-size:30px;color:var(--navy)">%100</div><div class="row-label" id="s0l1" style="left:36px;top:134px;font-size:30px">Bel hizası</div>
      <div class="bar" id="s0b1" style="left:300px;top:130px;width:286px;height:46px;background:var(--blue)"></div>
      <div class="val" id="s0y1" style="left:602px;top:134px;font-size:30px;color:var(--blue)">%50–60</div><div class="row-label" id="s0l2" style="left:36px;top:244px;font-size:30px">Boyun hizası</div>
      <div class="bar" id="s0b2" style="left:300px;top:240px;width:42px;height:46px;background:var(--red)"></div>
      <div class="val" id="s0y2" style="left:358px;top:244px;font-size:30px;color:var(--red)">%6–10</div></div><div class="callout" id="s0v" style="top:1420px">Yük azalır, hareket kalır.</div></div>
<div id="top" class="clip" data-start="0" data-duration="4" data-track-index="3"><div class="abs" style="left:72px;top:96px;width:936px;height:6px;border-radius:3px;background:rgba(127,134,150,0.28);overflow:hidden"><i id="p0" style="position:absolute;inset:0;background:var(--navy);transform-origin:left center;transform:scaleX(0)"></i></div><img src="marka/logo.png" alt="" style="position:absolute;right:72px;top:132px;width:84px;height:84px;border-radius:50%;box-shadow:0 4px 14px rgba(11,26,61,0.25)" /></div><div class="clip abs" style="inset:auto;left:72px;top:150px;font-size:26px;font-weight:700;letter-spacing:0.22em;color:var(--navy)" data-start="0" data-duration="4" data-track-index="4"><b style="color:var(--red);margin-right:10px">01</b>NEDEN SU</div>
<div class="clip abs" id="cap0" style="inset:auto;left:0;right:0;top:1590px;display:flex;justify-content:center" data-start="0.3" data-duration="1.2" data-track-index="5"><span style="padding:16px 34px;border-radius:22px;background:var(--navy);color:#fff;font-size:54px;font-weight:700;white-space:nowrap;box-shadow:0 12px 30px rgba(11,26,61,0.28)">Suda ağırlığınızı</span></div><div class="clip abs" id="cap1" style="inset:auto;left:0;right:0;top:1590px;display:flex;justify-content:center" data-start="1.6" data-duration="1" data-track-index="5"><span style="padding:16px 34px;border-radius:22px;background:var(--navy);color:#fff;font-size:54px;font-weight:700;white-space:nowrap;box-shadow:0 12px 30px rgba(11,26,61,0.28)">su taşır.</span></div><div class="clip abs" id="cap2" style="inset:auto;left:0;right:0;top:1590px;display:flex;justify-content:center" data-start="2.7" data-duration="1.3" data-track-index="5"><span style="padding:16px 34px;border-radius:22px;background:var(--navy);color:#fff;font-size:54px;font-weight:700;white-space:nowrap;box-shadow:0 12px 30px rgba(11,26,61,0.28)">Yük azalır.</span></div>
<div id="wipes" class="clip" data-start="0" data-duration="4" data-track-index="6"></div>



</div>
<script>
const tl = gsap.timeline({ paused: true });
const E = "power3.out";
tl.fromTo("#s0h .ln",{y:50,opacity:0},{y:0,opacity:1,duration:0.55,stagger:0.12,ease:E},0.2);
tl.fromTo(["#s0d1","#s0d2"],{scaleX:0,transformOrigin:"left center"},{scaleX:1,duration:0.4,stagger:0.1,ease:E},0.6);
tl.fromTo("#s0k",{opacity:0,x:-20},{opacity:1,x:0,duration:0.4},0.8);
tl.fromTo("#s0l0",{opacity:0,x:-20},{opacity:1,x:0,duration:0.3},0.9);
tl.fromTo("#s0b0",{scaleX:0},{scaleX:1,duration:0.7,ease:E},0.95);
tl.fromTo("#s0y0",{opacity:0},{opacity:1,duration:0.3},1.4);
tl.fromTo("#s0l1",{opacity:0,x:-20},{opacity:1,x:0,duration:0.3},1.3);
tl.fromTo("#s0b1",{scaleX:0},{scaleX:1,duration:0.7,ease:E},1.35);
tl.fromTo("#s0y1",{opacity:0},{opacity:1,duration:0.3},1.8);
tl.fromTo("#s0l2",{opacity:0,x:-20},{opacity:1,x:0,duration:0.3},1.7);
tl.fromTo("#s0b2",{scaleX:0},{scaleX:1,duration:0.7,ease:E},1.75);
tl.fromTo("#s0y2",{opacity:0},{opacity:1,duration:0.3},2.2);
tl.fromTo("#s0c",{y:50,opacity:0},{y:0,opacity:1,duration:0.5,ease:E},0.4);
tl.fromTo("#s0v",{y:30,scale:0.9,opacity:0},{y:0,scale:1,opacity:1,duration:0.4,ease:"back.out(2)"},2.6);
tl.fromTo("#p0",{scaleX:0},{scaleX:1,duration:4,ease:"none"},0);
tl.set("#p0,#p1,#p2,#p3,#p4,#p5,#p6,#p7".split(",").slice(0,1).join(","),{backgroundColor:"#0b1a3d"},0);
tl.fromTo("#cap0 span",{y:26,scale:0.94,opacity:0},{y:0,scale:1,opacity:1,duration:0.22,ease:"back.out(2)"},0.3);
tl.fromTo("#cap1 span",{y:26,scale:0.94,opacity:0},{y:0,scale:1,opacity:1,duration:0.22,ease:"back.out(2)"},1.6);
tl.fromTo("#cap2 span",{y:26,scale:0.94,opacity:0},{y:0,scale:1,opacity:1,duration:0.22,ease:"back.out(2)"},2.7);
tl.fromTo("#b1",{x:0,y:0},{x:60,y:120,duration:4,ease:"sine.inOut"},0);
tl.fromTo("#b2",{x:0,y:0},{x:-50,y:140,duration:4,ease:"sine.inOut"},0);
tl.fromTo("#b3",{x:0,y:0},{x:70,y:-110,duration:4,ease:"sine.inOut"},0);
tl.fromTo("#b4",{x:0,y:0},{x:-60,y:-90,duration:4,ease:"sine.inOut"},0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body></html>
